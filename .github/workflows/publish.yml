# Publica @scrakk-official/cli en npm al empujar un tag `v*`.
# Auth: npm Trusted Publishing (OIDC) — sin token guardado en el repo.
# El mismo run adjunta a la GitHub Release de ESTE repo:
#   - cli.tgz + install.sh  (fallback sin registry, requiere Node)
#   - binarios standalone   (fallback sin Node)
# No toca las releases de Scrakk Studio.

name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # adjuntar los fallbacks a la GitHub Release
  id-token: write # OIDC para Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          npm pack
          mv scrakk-official-cli-*.tgz cli.tgz

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Binarios standalone (sin Node)
        run: bun scripts/build-binaries.mjs

      # Fallback: binarios descargables en la Release de este repo.
      - name: Attach release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli.tgz
            release/*

      # Principal: publicar a npm via Trusted Publishing (OIDC, sin token).
      - name: Publish to npm
        run: npm publish --provenance --access public
