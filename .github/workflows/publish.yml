# Publica @scrakk-official/cli en npm al empujar un tag `v*`.
# Auth: npm Trusted Publishing (OIDC) — sin token guardado en el repo.
# El mismo run adjunta un fallback sin registry (cli.tgz + install.sh) a la
# GitHub Release de ESTE repo (no toca las releases de Scrakk Studio).

name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # adjuntar el fallback a la GitHub Release
  id-token: write # OIDC para Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          npm pack
          mv scrakk-official-cli-*.tgz cli.tgz

      # Fallback: tarball descargable en la Release de este repo.
      - name: Attach release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli.tgz
            install.sh

      # Principal: publicar a npm via Trusted Publishing (OIDC, sin token).
      - name: Publish to npm
        run: npm publish --provenance --access public
